<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Events | AchieveX</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f6fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #25245f;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .page-title {
            color: #25245f;
            font-weight: bold;
        }

        .event-form,
        .event-card {
            background: white;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .btn-primary {
            background: #5145cd;
            border: none;
        }

        .btn-primary:hover {
            background: #3930a5;
        }

        .event-category {
            display: inline-block;
            background: #e9e7ff;
            color: #5145cd;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .event-card h5 {
            color: #25245f;
            font-weight: bold;
        }

        .event-description {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                AchieveX
            </a>

            <a href="events.html" class="btn btn-outline-light btn-sm">
                View Public Events
            </a>
        </div>
    </nav>

    <main class="container py-5">

        <div class="mb-4">
            <h2 class="page-title">Manage College Events</h2>

            <p class="text-muted">
                Add and manage workshops, hackathons, and competitions.
            </p>
        </div>

        <!-- Message area -->
        <div
            id="message"
            class="alert d-none"
            role="alert"
            aria-live="polite"
        ></div>

        <!-- Add event form -->
        <section class="event-form p-4 mb-5">

            <h4 class="mb-4">Add New Event</h4>

            <form id="eventForm">

                <div class="mb-3">
                    <label for="title" class="form-label">
                        Event Title *
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="title"
                        name="title"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        Description *
                    </label>

                    <textarea
                        class="form-control"
                        id="description"
                        name="description"
                        rows="4"
                        required
                    ></textarea>
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="category" class="form-label">
                            Category
                        </label>

                        <select
                            class="form-select"
                            id="category"
                            name="category"
                        >
                            <option value="Technical">Technical</option>
                            <option value="Workshop">Workshop</option>
                            <option value="Hackathon">Hackathon</option>
                            <option value="Competition">Competition</option>
                            <option value="Cultural">Cultural</option>
                            <option value="Sports">Sports</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="date" class="form-label">
                            Event Date *
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="date"
                            name="date"
                            required
                        >
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="venue" class="form-label">
                            Venue
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="venue"
                            name="venue"
                            placeholder="College auditorium"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="organizer" class="form-label">
                            Organizer
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="organizer"
                            name="organizer"
                            placeholder="CSE Department"
                        >
                    </div>

                </div>

                <button
                    type="submit"
                    id="addEventBtn"
                    class="btn btn-primary px-4"
                >
                    Add Event
                </button>

            </form>

        </section>

        <!-- Existing events -->
        <section>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4>Existing Events</h4>
                <button id="refreshBtn" class="btn btn-outline-primary btn-sm">
                    Refresh
                </button>
            </div>

            <div id="eventsList" class="row g-4">
                <div class="col-12 text-muted">
                    Loading events...
                </div>
            </div>

        </section>

    </main>

    <script src="js/admin-events.js"></script>

</body>
</html>
