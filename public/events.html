<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Events | AchieveX</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #172554;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .hero {
            background: linear-gradient(135deg, #172554, #4338ca);
            color: white;
            padding: 55px 20px;
            text-align: center;
        }

        .event-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
            height: 100%;
            transition: transform 0.2s;
        }

        .event-card:hover {
            transform: translateY(-5px);
        }

        .event-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .event-date {
            color: #4338ca;
            font-weight: bold;
        }

        .event-type {
            background: #e0e7ff;
            color: #3730a3;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        footer {
            background: #172554;
            color: white;
            padding: 20px;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                AchieveX
            </a>

            <button
                class="navbar-toggler bg-light"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="achievements.html">
                            Achievements
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="events.html">
                            Events
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            Student Dashboard
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1 class="fw-bold">College Events</h1>

            <p class="lead mb-0">
                Discover workshops, hackathons, symposiums, and competitions.
            </p>
        </div>
    </section>

    <!-- Events Section -->
    <main class="container py-5">

        <div class="text-center mb-4">
            <h2 class="fw-bold">Explore Events</h2>

            <p class="text-muted">
                Find opportunities to learn, participate, and showcase your skills.
            </p>
        </div>

        <div class="row g-4" id="eventsList">

            <!-- Events will load here from MongoDB -->

            <div class="col-12 text-center">
                <p>Loading events...</p>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p class="mb-0">
            © 2026 AchieveX | College Achievement Showcase
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/events.js"></script>

</body>
</html>
